<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>KART KIDS — Track Editor</title>
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<link rel="stylesheet" href="css/track-editor.css">
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<div class="kk-editor-shell" id="editor-shell">
		<!-- Top Bar -->
		<header class="kk-editor-shell__topbar" id="editor-topbar"></header>

		<!-- Left Tool Rail -->
		<nav class="kk-editor-shell__toolrail" id="editor-toolrail"></nav>

		<!-- Center Viewport -->
		<main class="kk-editor-shell__viewport" id="editor-viewport">
			<canvas id="editor-canvas"></canvas>
			<div class="kk-editor-minimap" id="editor-minimap">
				<canvas id="minimap-canvas" width="180" height="180"></canvas>
			</div>
			<div class="kk-editor-stats" id="editor-stats"></div>

			<!-- Compass overlay (rotated 45° to match isometric view) -->
			<div id="editor-compass" style="
				position:absolute; bottom:80px; left:16px;
				pointer-events:none; z-index:50;
			">
				<div style="
					width:72px; height:72px; position:relative;
					transform:rotate(-45deg);
					border:1px solid rgba(255,255,255,0.15);
					border-radius:50%; background:rgba(0,0,0,0.4);
				">
					<span style="position:absolute;top:-2px;left:50%;transform:translateX(-50%);
						color:#ef4444;font:bold 13px monospace;">N</span>
					<span style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
						color:#3b82f6;font:bold 13px monospace;">S</span>
					<span style="position:absolute;right:-2px;top:50%;transform:translateY(-50%);
						color:#22c55e;font:bold 13px monospace;">E</span>
					<span style="position:absolute;left:-2px;top:50%;transform:translateY(-50%);
						color:#f59e0b;font:bold 13px monospace;">W</span>
					<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
						width:1px;height:30px;background:rgba(255,255,255,0.2);"></div>
					<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
						width:30px;height:1px;background:rgba(255,255,255,0.2);"></div>
					<div style="position:absolute;top:8px;left:50%;transform:translateX(-50%);
						width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
						border-bottom:6px solid #ef4444;"></div>
				</div>
				<div style="text-align:center;margin-top:4px;color:rgba(255,255,255,0.3);
					font:9px monospace;">-Z=N  +X=E</div>
			</div>
		</main>

		<!-- Right Inspector -->
		<aside class="kk-editor-shell__inspector" id="editor-inspector"></aside>

		<!-- Bottom Carousel -->
		<section class="kk-editor-shell__carousel" id="editor-carousel"></section>

		<!-- Bottom Status Bar -->
		<footer class="kk-editor-shell__statusbar" id="editor-statusbar"></footer>
	</div>

	<script type="module" src="js/track-editor/core/EditorApp.js"></script>
</body>
</html>
