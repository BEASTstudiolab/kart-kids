<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>KART KIDS — Track Editor</title>
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<link rel="stylesheet" href="css/track-editor.css">
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<div class="kk-editor-shell" id="editor-shell">
		<!-- Top Bar -->
		<header class="kk-editor-shell__topbar" id="editor-topbar"></header>

		<!-- Left Tool Rail -->
		<nav class="kk-editor-shell__toolrail" id="editor-toolrail"></nav>

		<!-- Center Viewport -->
		<main class="kk-editor-shell__viewport" id="editor-viewport">
			<canvas id="editor-canvas"></canvas>
			<div class="kk-editor-minimap" id="editor-minimap">
				<canvas id="minimap-canvas" width="180" height="180"></canvas>
			</div>
			<div class="kk-editor-stats" id="editor-stats"></div>
			<div class="kk-editor-route-trace" id="editor-route-trace-controls" role="group" aria-label="Route trace playback controls" hidden>
				<button class="kk-editor-route-trace__btn" id="route-trace-play" type="button">Play</button>
				<button class="kk-editor-route-trace__btn" id="route-trace-pause" type="button">Pause</button>
			</div>

			<!-- Compass overlay -->
			<div class="kk-editor-compass" id="editor-compass" aria-hidden="true">
				<div class="kk-editor-compass__shell">
					<div class="kk-editor-compass__rose" data-role="compass-rose">
						<span class="kk-editor-compass__label kk-editor-compass__label--north">N</span>
						<span class="kk-editor-compass__label kk-editor-compass__label--south">S</span>
						<span class="kk-editor-compass__label kk-editor-compass__label--east">E</span>
						<span class="kk-editor-compass__label kk-editor-compass__label--west">W</span>
						<div class="kk-editor-compass__cross kk-editor-compass__cross--vertical"></div>
						<div class="kk-editor-compass__cross kk-editor-compass__cross--horizontal"></div>
						<div class="kk-editor-compass__needle"></div>
					</div>
				</div>
				<div class="kk-editor-compass__legend">-Z=N  +X=E</div>
			</div>
		</main>

		<!-- Right Inspector -->
		<aside class="kk-editor-shell__inspector" id="editor-inspector"></aside>

		<!-- Bottom Carousel -->
		<section class="kk-editor-shell__carousel" id="editor-carousel"></section>

		<!-- Bottom Status Bar -->
		<footer class="kk-editor-shell__statusbar" id="editor-statusbar"></footer>
	</div>

	<script type="module" src="js/track-editor/core/EditorApp.js"></script>
</body>
</html>
