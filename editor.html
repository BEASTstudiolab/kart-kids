<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Track Editor</title>
	<link rel="stylesheet" href="css/editor.css">
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<div id="toolbar-row">
		<div class="toolbar-group" id="toolbar-tools">
			<span class="group-label">Tools</span>
			<button id="btn-road" class="active" data-tip="Draw road">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
			</button>
			<button id="btn-erase" data-tip="Erase">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
			</button>
			<button id="btn-elevate" data-tip="Elevate">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
			</button>
			<button id="btn-finish" data-tip="Place Start/Finish (4)">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
			</button>
			<div class="separator"></div>
			<button id="btn-undo" disabled data-tip="Undo (⌘Z)">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
			</button>
			<button id="btn-redo" disabled data-tip="Redo (⌘⇧Z)">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
			</button>
		</div>
		<div class="toolbar-group" id="toolbar-special">
			<span class="group-label">Special</span>
			<select id="special-tile-select">
				<option value="">— Select tile —</option>
				<optgroup label="Junctions (3x3)">
					<option value="trk-junction-y">Y-Split</option>
					<option value="trk-junction-t">T-Junction</option>
					<option value="trk-junction-4way">4-Way</option>
				</optgroup>
				<optgroup label="Bridges">
					<option value="trk-bridge-entry">Bridge Entry</option>
					<option value="trk-bridge-mid">Bridge Mid</option>
				</optgroup>
				<optgroup label="Tunnels">
					<option value="trk-tunnel-entry">Tunnel Entry</option>
					<option value="trk-tunnel-mid">Tunnel Mid</option>
					<option value="trk-tunnel-exit">Tunnel Exit</option>
					<option value="trk-tunnel-open">Tunnel Open</option>
				</optgroup>
				<optgroup label="Jumps">
					<option value="trk-jump-short">Jump Short</option>
					<option value="trk-jump-long">Jump Long</option>
				</optgroup>
				<optgroup label="Chicane (3x3)">
					<option value="trk-chicane-3x3-l">Chicane</option>
				</optgroup>
			</select>
		</div>
		<div class="toolbar-group" id="toolbar-view">
			<span class="group-label">View</span>
			<button id="btn-view-top" class="active" data-tip="Top-down">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg>
			</button>
			<button id="btn-view-iso" data-tip="Isometric">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
			</button>
			<button id="btn-view-front" data-tip="Front">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
			</button>
			<div class="separator"></div>
			<button id="btn-tod" data-tip="Time of day">
				<svg id="icon-tod" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
			</button>
		</div>
		<div class="toolbar-group" id="toolbar-file">
			<span class="group-label">File</span>
			<button id="btn-save" data-tip="Save">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
			</button>
			<button id="btn-load" data-tip="Load">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
			</button>
			<div class="separator"></div>
			<button id="btn-validate" data-tip="Validate">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
			</button>
			<div class="separator"></div>
			<button id="btn-clear" class="danger" data-tip="Clear all">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
			</button>
		</div>
		<div class="toolbar-group" id="toolbar-play">
			<span class="group-label">Play</span>
			<button id="btn-play" class="action" data-tip="Play">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
			</button>
			<button id="btn-share" class="action" data-tip="Share link">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
			</button>
		</div>
	</div>

	<div id="toast"></div>

	<div id="debug-tooltip"></div>
	<div id="radial-menu">
		<button id="radial-rotate" class="radial-btn" data-tip="Rotate">
			<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
		</button>
		<button id="radial-curve" class="radial-btn" data-tip="Toggle curve">
			<svg id="radial-curve-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 20c-2 0-4-.5-6-2s-4-4-6-4-4 .5-6 2"/></svg>
		</button>
		<button id="radial-elevate" class="radial-btn" data-tip="Elevate">
			<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
		</button>
	</div>
	<div id="minimap"></div>

	<div id="stats-panel">
		<span class="label">Pieces:</span> <span id="stat-pieces">1</span><br>
		<span class="label">Straights:</span> <span id="stat-straights">0</span>
		<span class="label" style="margin-left:8px">Corners:</span> <span id="stat-corners">0</span><br>
		<span class="label">Length:</span> <span id="stat-length">0m</span><br>
		<span class="label">Loop:</span> <span id="stat-loop" class="warn">No</span>
	</div>

	<!-- Save modal -->
	<div id="modal-save" class="modal-overlay hidden">
		<div class="modal">
			<h3>Save Track</h3>
			<input type="text" id="save-name" placeholder="Track name..." maxlength="40" autocomplete="off">
			<div class="modal-actions">
				<button class="btn-cancel" id="save-cancel">Cancel</button>
				<button class="btn-primary" id="save-confirm">Save</button>
			</div>
		</div>
	</div>

	<!-- Load modal -->
	<div id="modal-load" class="modal-overlay hidden">
		<div class="modal">
			<h3>Load Track</h3>
			<ul class="saved-track-list" id="load-list"></ul>
			<div class="modal-actions">
				<button class="btn-cancel" id="load-cancel">Close</button>
			</div>
		</div>
	</div>

	<script type="module" src="js/editor/editor-main.js"></script>
</body>
</html>
