<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Track Editor</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }

		#toolbar {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 8px 10px;
			background: rgba(20, 20, 30, 0.85);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
			z-index: 10;
		}

		#toolbar button {
			padding: 8px 16px;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: rgba(255, 255, 255, 0.65);
			font-size: 13px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.15s;
			white-space: nowrap;
		}
		#toolbar button:hover {
			background: rgba(255, 255, 255, 0.1);
			color: #fff;
		}
		#toolbar button.active {
			background: rgba(255, 255, 255, 0.18);
			color: #fff;
		}

		.separator {
			width: 1px;
			height: 24px;
			background: rgba(255, 255, 255, 0.15);
			margin: 0 2px;
			flex-shrink: 0;
		}

		#toolbar button.action {
			background: rgba(80, 180, 80, 0.25);
			color: rgba(140, 255, 140, 0.9);
		}
		#toolbar button.action:hover {
			background: rgba(80, 180, 80, 0.4);
			color: #fff;
		}

		#toolbar button.danger {
			color: rgba(255, 255, 255, 0.45);
		}
		#toolbar button.danger:hover {
			background: rgba(220, 80, 80, 0.25);
			color: rgba(255, 140, 140, 0.9);
		}

		#toolbar button:disabled {
			opacity: 0.3;
			cursor: default;
			pointer-events: none;
		}

		#toast {
			position: absolute;
			bottom: 90px;
			left: 50%;
			transform: translateX(-50%);
			padding: 10px 24px;
			background: rgba(20, 20, 30, 0.85);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			color: #fff;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			font-size: 13px;
			opacity: 0;
			transition: opacity 0.3s;
			pointer-events: none;
			z-index: 20;
		}
		#toast.show { opacity: 1; }

		/* ─── Minimap ──────────────────────────────────────────── */

		#minimap {
			position: absolute;
			bottom: 80px;
			right: 16px;
			width: 180px;
			height: 180px;
			background: rgba(20, 20, 30, 0.75);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			overflow: hidden;
			z-index: 10;
		}
		#minimap canvas { width: 100%; height: 100%; }

		/* ─── Stats panel ──────────────────────────────────────── */

		#stats-panel {
			position: absolute;
			top: 16px;
			right: 16px;
			padding: 12px 16px;
			background: rgba(20, 20, 30, 0.75);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			color: rgba(255, 255, 255, 0.8);
			font-size: 12px;
			line-height: 1.7;
			z-index: 10;
			pointer-events: none;
		}
		#stats-panel .label { color: rgba(255, 255, 255, 0.45); }
		#stats-panel .warn { color: rgba(255, 180, 80, 0.9); }
		#stats-panel .ok { color: rgba(140, 255, 140, 0.9); }

		/* ─── Modal overlay ────────────────────────────────────── */

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.6);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
		}
		.modal-overlay.hidden { display: none; }

		.modal {
			background: rgba(30, 30, 45, 0.95);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
			color: #fff;
			padding: 24px;
			min-width: 320px;
			max-width: 440px;
			max-height: 80vh;
			overflow-y: auto;
		}
		.modal h3 {
			margin: 0 0 16px;
			font-size: 16px;
			font-weight: 600;
		}
		.modal input[type="text"] {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
			font-size: 14px;
			outline: none;
			margin-bottom: 12px;
		}
		.modal input[type="text"]:focus {
			border-color: rgba(140, 255, 140, 0.5);
		}
		.modal-actions {
			display: flex;
			gap: 8px;
			justify-content: flex-end;
			margin-top: 16px;
		}
		.modal-actions button {
			padding: 8px 20px;
			border: none;
			border-radius: 8px;
			font-size: 13px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.15s;
		}
		.modal-actions .btn-primary {
			background: rgba(80, 180, 80, 0.35);
			color: rgba(140, 255, 140, 0.95);
		}
		.modal-actions .btn-primary:hover {
			background: rgba(80, 180, 80, 0.55);
		}
		.modal-actions .btn-cancel {
			background: rgba(255, 255, 255, 0.08);
			color: rgba(255, 255, 255, 0.65);
		}
		.modal-actions .btn-cancel:hover {
			background: rgba(255, 255, 255, 0.15);
			color: #fff;
		}

		.saved-track-list {
			list-style: none;
			padding: 0;
			margin: 0 0 8px;
			max-height: 300px;
			overflow-y: auto;
		}
		.saved-track-list li {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 12px;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.15s;
		}
		.saved-track-list li:hover {
			background: rgba(255, 255, 255, 0.08);
		}
		.saved-track-list li .track-name {
			font-size: 14px;
			font-weight: 500;
		}
		.saved-track-list li .track-meta {
			font-size: 11px;
			color: rgba(255, 255, 255, 0.4);
		}
		.saved-track-list li .delete-btn {
			background: none;
			border: none;
			color: rgba(255, 80, 80, 0.6);
			cursor: pointer;
			font-size: 16px;
			padding: 2px 6px;
			border-radius: 4px;
		}
		.saved-track-list li .delete-btn:hover {
			background: rgba(255, 80, 80, 0.15);
			color: rgba(255, 80, 80, 0.9);
		}
		.saved-track-list .empty-msg {
			text-align: center;
			color: rgba(255, 255, 255, 0.35);
			padding: 20px;
			font-size: 13px;
		}

	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<div id="toolbar">
		<button id="btn-road" class="active">Road</button>
		<button id="btn-erase">Erase</button>
		<div class="separator"></div>
		<button id="btn-undo" disabled title="Undo (Ctrl+Z)">Undo</button>
		<button id="btn-redo" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
		<div class="separator"></div>
		<button id="btn-play" class="action">Play</button>
		<button id="btn-share" class="action">Share</button>
		<div class="separator"></div>
		<button id="btn-save">Save</button>
		<button id="btn-load">Load</button>
		<div class="separator"></div>
		<button id="btn-validate">Validate</button>
		<div class="separator"></div>
		<button id="btn-view-top" class="active" title="Top-down (0)">Top</button>
		<button id="btn-view-iso" title="Isometric">Iso</button>
		<button id="btn-view-front" title="Front view">Front</button>
		<div class="separator"></div>
		<button id="btn-tod" title="Time of day">Day</button>
		<div class="separator"></div>
		<button id="btn-clear" class="danger">Clear</button>
	</div>

	<div id="toast"></div>
	<div id="minimap"></div>

	<div id="stats-panel">
		<span class="label">Pieces:</span> <span id="stat-pieces">1</span><br>
		<span class="label">Straights:</span> <span id="stat-straights">0</span>
		<span class="label" style="margin-left:8px">Corners:</span> <span id="stat-corners">0</span><br>
		<span class="label">Length:</span> <span id="stat-length">0m</span><br>
		<span class="label">Loop:</span> <span id="stat-loop" class="warn">No</span>
	</div>

	<!-- Save modal -->
	<div id="modal-save" class="modal-overlay hidden">
		<div class="modal">
			<h3>Save Track</h3>
			<input type="text" id="save-name" placeholder="Track name..." maxlength="40" autocomplete="off">
			<div class="modal-actions">
				<button class="btn-cancel" id="save-cancel">Cancel</button>
				<button class="btn-primary" id="save-confirm">Save</button>
			</div>
		</div>
	</div>

	<!-- Load modal -->
	<div id="modal-load" class="modal-overlay hidden">
		<div class="modal">
			<h3>Load Track</h3>
			<ul class="saved-track-list" id="load-list"></ul>
			<div class="modal-actions">
				<button class="btn-cancel" id="load-cancel">Close</button>
			</div>
		</div>
	</div>

	<script type="module">
	import * as THREE from 'three';
	import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
	import { ORIENT_DEG, CELL_RAW, GRID_SCALE, encodeCells, decodeCells } from './js/Track.js';

	// ─── Auto-tile lookup ─────────────────────────────────────
	// Bitmask: N=8 S=4 E=2 W=1
	// Corner connectivity: 0°=S+W, 90°=S+E, 180°=N+E, 270°=N+W

	const ORIENT_FLIP = { 0: 10, 10: 0, 16: 22, 22: 16 };

	const AUTOTILE = [
		[ 'trk-straight', 0 ],    //  0: isolated
		[ 'trk-straight', 16 ],   //  1: W
		[ 'trk-straight', 16 ],   //  2: E
		[ 'trk-straight', 16 ],   //  3: E+W
		[ 'trk-straight', 0 ],    //  4: S
		[ 'trk-corner-1x1',   0 ],    //  5: S+W
		[ 'trk-corner-1x1',   16 ],   //  6: S+E
		[ 'trk-straight', 16 ],   //  7: S+E+W
		[ 'trk-straight', 0 ],    //  8: N
		[ 'trk-corner-1x1',   22 ],   //  9: N+W
		[ 'trk-corner-1x1',   10 ],   // 10: N+E
		[ 'trk-straight', 16 ],   // 11: N+E+W
		[ 'trk-straight', 0 ],    // 12: N+S
		[ 'trk-straight', 0 ],    // 13: N+S+W
		[ 'trk-straight', 0 ],    // 14: N+S+E
		[ 'trk-straight', 0 ],    // 15: N+S+E+W
	];

	// ─── State ────────────────────────────────────────────────

	const grid = new Map(); // "gx,gz" → { type, orient, isFinish, mesh }
	let tool = 'road'; // 'road', 'erase'

	function cellKey( gx, gz ) { return gx + ',' + gz; }

	// ─── Undo / Redo ─────────────────────────────────────────

	const undoStack = [];
	const redoStack = [];
	const MAX_UNDO = 100;

	function snapshotGrid() {

		const snap = [];
		for ( const [ key, cell ] of grid ) {

			const [ gx, gz ] = key.split( ',' ).map( Number );
			snap.push( [ gx, gz, cell.type, cell.orient, cell.isFinish ] );

		}

		return snap;

	}

	function restoreSnapshot( snap ) {

		// Remove all existing meshes
		for ( const [ , cell ] of grid ) {

			if ( cell.mesh ) trackGroup.remove( cell.mesh );

		}

		grid.clear();

		for ( const [ gx, gz, type, orient, isFinish ] of snap ) {

			const cell = { type, orient, isFinish, mesh: null };
			grid.set( cellKey( gx, gz ), cell );
			placeMesh( gx, gz, cell );

		}

		save();
		updateStats();
		updateFinishCar();

	}

	function pushUndo() {

		undoStack.push( snapshotGrid() );
		if ( undoStack.length > MAX_UNDO ) undoStack.shift();
		redoStack.length = 0;
		updateUndoButtons();

	}

	function undo() {

		if ( undoStack.length === 0 ) return;
		redoStack.push( snapshotGrid() );
		restoreSnapshot( undoStack.pop() );
		updateUndoButtons();

	}

	function redo() {

		if ( redoStack.length === 0 ) return;
		undoStack.push( snapshotGrid() );
		restoreSnapshot( redoStack.pop() );
		updateUndoButtons();

	}

	function updateUndoButtons() {

		document.getElementById( 'btn-undo' ).disabled = undoStack.length === 0;
		document.getElementById( 'btn-redo' ).disabled = redoStack.length === 0;

	}

	// ─── Renderer ─────────────────────────────────────────────

	const renderer = new THREE.WebGLRenderer( { antialias: true } );
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.setPixelRatio( window.devicePixelRatio );
	renderer.shadowMap.enabled = true;
	renderer.toneMapping = THREE.ACESFilmicToneMapping;
	renderer.toneMappingExposure = 1.0;
	document.body.appendChild( renderer.domElement );

	// ─── Scene ────────────────────────────────────────────────

	const scene = new THREE.Scene();
	scene.background = new THREE.Color( 0xadb2ba );
	scene.fog = new THREE.Fog( 0xadb2ba, 80, 160 );

	const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
	dirLight.position.set( 11.4, 15, - 5.3 );
	dirLight.castShadow = true;
	dirLight.shadow.mapSize.setScalar( 4096 );
	dirLight.shadow.camera.near = 0.5;
	dirLight.shadow.camera.far = 100;
	dirLight.shadow.camera.left = - 60;
	dirLight.shadow.camera.right = 60;
	dirLight.shadow.camera.top = 60;
	dirLight.shadow.camera.bottom = - 60;
	scene.add( dirLight );

	const hemiLight = new THREE.HemisphereLight( 0xc8d8e8, 0x7a8a5a, 1.5 );
	scene.add( hemiLight );

	// Ground
	const groundMat = new THREE.MeshStandardMaterial( { color: 0x369069, metalness: 0 } );
	const ground = new THREE.Mesh( new THREE.PlaneGeometry( 200, 200 ), groundMat );
	ground.rotation.x = - Math.PI / 2;
	ground.position.y = - 0.14;
	ground.receiveShadow = true;
	scene.add( ground );

	// Grid helper
	const gridSize = 30;
	const cellWorld = CELL_RAW * GRID_SCALE;
	const gridHelper = new THREE.GridHelper( gridSize * cellWorld, gridSize, 0x4a7a2a, 0x4a7a2a );
	gridHelper.position.y = - 0.49;
	gridHelper.material.opacity = 0.3;
	gridHelper.material.transparent = true;
	scene.add( gridHelper );

	// Track group (mirrors game structure)
	const trackGroup = new THREE.Group();
	trackGroup.position.y = - 0.5;
	trackGroup.scale.setScalar( GRID_SCALE );
	scene.add( trackGroup );

	// Ghost preview group
	const ghostGroup = new THREE.Group();
	ghostGroup.position.y = - 0.5;
	ghostGroup.scale.setScalar( GRID_SCALE );
	scene.add( ghostGroup );
	let ghostMesh = null;

	// ─── Grid snap indicator ──────────────────────────────────

	const indicatorGeo = new THREE.PlaneGeometry( cellWorld, cellWorld );
	const indicatorMat = new THREE.MeshBasicMaterial( {
		color: 0xffffff,
		opacity: 0.15,
		transparent: true,
		depthTest: false
	} );
	const cellIndicator = new THREE.Mesh( indicatorGeo, indicatorMat );
	cellIndicator.rotation.x = - Math.PI / 2;
	cellIndicator.position.y = - 0.1;
	cellIndicator.visible = false;
	scene.add( cellIndicator );

	// Outline ring for the indicator
	const outlineGeo = new THREE.EdgesGeometry( new THREE.PlaneGeometry( cellWorld, cellWorld ) );
	const outlineMat = new THREE.LineBasicMaterial( { color: 0xffffff, opacity: 0.5, transparent: true, depthTest: false } );
	const cellOutline = new THREE.LineSegments( outlineGeo, outlineMat );
	cellOutline.rotation.x = - Math.PI / 2;
	cellOutline.position.y = - 0.09;
	cellOutline.visible = false;
	scene.add( cellOutline );

	// ─── Camera (orthographic) ────────────────────────────────

	const frustum = 30;
	const aspect = window.innerWidth / window.innerHeight;
	const camera = new THREE.OrthographicCamera(
		- frustum * aspect, frustum * aspect,
		frustum, - frustum,
		0.1, 200
	);
	const cellCenter = 0.5 * CELL_RAW * GRID_SCALE;
	const camTarget = new THREE.Vector3( cellCenter, 0, cellCenter );

	// ─── Orbit / tilt / height state ──────────────────────────

	let orbitAngle = 0;
	let tiltAngle = Math.PI / 2;
	let isOrbiting = false;
	let orbitStartMouse = { x: 0, y: 0 };
	let orbitAngleStart = 0;
	let tiltAngleStart = 0;
	let camHeightStart = 0;
	let camPanStart = { x: 0, z: 0 };

	function updateCamera() {

		const dist = 50;
		camera.position.x = camTarget.x + dist * Math.cos( tiltAngle ) * Math.sin( orbitAngle );
		camera.position.y = camTarget.y + dist * Math.sin( tiltAngle );
		camera.position.z = camTarget.z + dist * Math.cos( tiltAngle ) * Math.cos( orbitAngle );
		camera.lookAt( camTarget );

	}

	function getCameraPanAxes() {

		const right = new THREE.Vector3( Math.cos( orbitAngle ), 0, - Math.sin( orbitAngle ) );
		const fwd = new THREE.Vector3( - Math.sin( orbitAngle ), 0, - Math.cos( orbitAngle ) );
		return { right, fwd };

	}

	updateCamera();

	// ─── View presets ─────────────────────────────────────────

	const viewBtnTop = document.getElementById( 'btn-view-top' );
	const viewBtnIso = document.getElementById( 'btn-view-iso' );
	const viewBtnFront = document.getElementById( 'btn-view-front' );

	function setView( name ) {

		if ( name === 'top' ) {

			orbitAngle = 0;
			tiltAngle = Math.PI / 2;

		} else if ( name === 'iso' ) {

			orbitAngle = Math.PI / 4;
			tiltAngle = Math.PI / 5.1; // ~35°

		} else if ( name === 'front' ) {

			orbitAngle = 0;
			tiltAngle = 0.25; // ~14°

		}

		camTarget.y = 0;
		updateCamera();

		viewBtnTop.classList.toggle( 'active', name === 'top' );
		viewBtnIso.classList.toggle( 'active', name === 'iso' );
		viewBtnFront.classList.toggle( 'active', name === 'front' );

	}

	viewBtnTop.addEventListener( 'click', () => setView( 'top' ) );
	viewBtnIso.addEventListener( 'click', () => setView( 'iso' ) );
	viewBtnFront.addEventListener( 'click', () => setView( 'front' ) );

	// ─── Time of day ──────────────────────────────────────────

	const TOD_PRESETS = {
		day: {
			bg: 0xadb2ba,
			fog: 0xadb2ba,
			dirColor: 0xffffff,
			dirIntensity: 5,
			dirPos: [ 11.4, 15, - 5.3 ],
			hemiSky: 0xc8d8e8,
			hemiGround: 0x7a8a5a,
			hemiIntensity: 1.5,
			groundColor: 0x369069,
			exposure: 1.0,
			label: 'Day'
		},
		sunset: {
			bg: 0x8a6050,
			fog: 0x8a6050,
			dirColor: 0xffaa66,
			dirIntensity: 4,
			dirPos: [ 3, 5, - 12 ],
			hemiSky: 0xffccaa,
			hemiGround: 0x553322,
			hemiIntensity: 1.0,
			groundColor: 0x2d6648,
			exposure: 0.85,
			label: 'Sunset'
		},
		night: {
			bg: 0x1a1a2e,
			fog: 0x1a1a2e,
			dirColor: 0x8888cc,
			dirIntensity: 2,
			dirPos: [ - 5, 12, 8 ],
			hemiSky: 0x334466,
			hemiGround: 0x111122,
			hemiIntensity: 0.6,
			groundColor: 0x1a4a35,
			exposure: 0.6,
			label: 'Night'
		}
	};

	const todOrder = [ 'day', 'sunset', 'night' ];
	let todIndex = 0;
	const btnTod = document.getElementById( 'btn-tod' );

	function applyTod( name ) {

		const p = TOD_PRESETS[ name ];
		scene.background.setHex( p.bg );
		scene.fog.color.setHex( p.fog );
		dirLight.color.setHex( p.dirColor );
		dirLight.intensity = p.dirIntensity;
		dirLight.position.set( ...p.dirPos );
		hemiLight.color.setHex( p.hemiSky );
		hemiLight.groundColor.setHex( p.hemiGround );
		hemiLight.intensity = p.hemiIntensity;
		groundMat.color.setHex( p.groundColor );
		renderer.toneMappingExposure = p.exposure;
		btnTod.textContent = p.label;

	}

	btnTod.addEventListener( 'click', () => {

		todIndex = ( todIndex + 1 ) % todOrder.length;
		applyTod( todOrder[ todIndex ] );

	} );

	// ─── Minimap ──────────────────────────────────────────────

	const minimapSize = 180;
	const minimapCanvas = document.createElement( 'canvas' );
	minimapCanvas.width = minimapSize;
	minimapCanvas.height = minimapSize;
	document.getElementById( 'minimap' ).appendChild( minimapCanvas );
	const mmCtx = minimapCanvas.getContext( '2d' );

	function updateMinimap() {

		mmCtx.clearRect( 0, 0, minimapSize, minimapSize );
		mmCtx.fillStyle = 'rgba(20, 50, 35, 0.6)';
		mmCtx.fillRect( 0, 0, minimapSize, minimapSize );

		if ( grid.size === 0 ) return;

		// Find bounds

	function validateTrack() {

		const exitDirs = [

			{ bit: 4, dx: 0, dz: 1 },
			{ bit: 2, dx: 1, dz: 0 },
			{ bit: 1, dx: - 1, dz: 0 },
		];

		let walkDir = null;

		for ( const d of exitDirs ) {

			if ( ! ( startExits & d.bit ) ) continue;
			const nKey = cellKey( sx + d.dx, sz + d.dz );
			if ( grid.has( nKey ) ) { walkDir = d; break; }

		}

		if ( ! walkDir ) return { valid: false, message: 'Finish line has no connected road' };

		// Walk
		const visited = new Set();
		visited.add( startKey );
		let cx = sx + walkDir.dx;
		let cz = sz + walkDir.dz;
		let prevX = sx;
		let prevZ = sz;

		for ( let steps = 0; steps < 1000; steps ++ ) {

			const key = cellKey( cx, cz );

			// Did we loop back to start?
			if ( key === startKey ) {

				if ( visited.size === grid.size ) {

					return { valid: true, message: `Valid loop! (${ visited.size } pieces)` };

				}

				return {
					valid: false,
					message: `Loop found but ${ grid.size - visited.size } pieces are disconnected`
				};

			}

			const cell = grid.get( key );
			if ( ! cell ) return { valid: false, message: 'Track has a dead end' };

			if ( visited.has( key ) ) return { valid: false, message: 'Track crosses itself' };

			visited.add( key );

			// Find next cell: follow exits that aren't back where we came from
			const exits = getCellExits( cell );
			let moved = false;

			for ( const d of exitDirs ) {

				if ( ! ( exits & d.bit ) ) continue;
				const nx = cx + d.dx;
				const nz = cz + d.dz;
				if ( nx === prevX && nz === prevZ ) continue;

				prevX = cx;
				prevZ = cz;
				cx = nx;
				cz = nz;
				moved = true;
				break;

			}

			if ( ! moved ) return { valid: false, message: 'Track has a dead end' };

		}

		return { valid: false, message: 'Track is too long or has an issue' };

	}

			isErasing = false;
			lastDrawCell = null;
			el.style.cursor = spaceDown ? 'grab' : '';

		}

	} );

	window.addEventListener( 'pointercancel', ( e ) => {

		pointers.delete( e.pointerId );

	} );

	function zoomCamera( delta ) {

		const zoomSpeed = 1.08;
		camera.zoom *= delta > 0 ? 1 / zoomSpeed : zoomSpeed;
		camera.zoom = Math.max( 0.1, Math.min( 10, camera.zoom ) );
		camera.updateProjectionMatrix();

	}

	el.addEventListener( 'wheel', ( e ) => {

		e.preventDefault();
		zoomCamera( e.deltaY );

	}, { passive: false } );

	window.addEventListener( 'keydown', ( e ) => {

		// Don't capture keys when typing in an input
		if ( e.target.tagName === 'INPUT' ) return;

		if ( e.key === ' ' ) {

			if ( ! spaceDown ) {

				spaceDown = true;
				el.style.cursor = 'grab';

			}

			e.preventDefault();

		} else if ( e.key === '1' ) {

			selectTool( 'road' );

		} else if ( e.key === '2' ) {

			selectTool( 'erase' );

		} else if ( e.key === '0' ) {

			setView( 'top' );

		} else if ( e.key === 'z' && ( e.ctrlKey || e.metaKey ) && e.shiftKey ) {

			e.preventDefault();
			redo();

		} else if ( e.key === 'z' && ( e.ctrlKey || e.metaKey ) ) {

			e.preventDefault();
			undo();

		} else if ( e.key === '+' || e.key === '=' ) {

			zoomCamera( - 1 );

		} else if ( e.key === '-' || e.key === '_' ) {

			zoomCamera( 1 );

		}

	} );

	window.addEventListener( 'keyup', ( e ) => {

		if ( e.key === ' ' ) {

			spaceDown = false;
			if ( ! isPanning ) el.style.cursor = '';

		}

	} );

	// ─── Init & render loop ───────────────────────────────────

	await loadModels();
	loadSaved();

	// Start with a finish cell if the grid is empty
	if ( grid.size === 0 ) {

		placeFinish();

	}

	updateStats();
	updateFinishCar();

	function animate() {

		requestAnimationFrame( animate );
		renderer.render( scene, camera );
		updateMinimap();

	}

	animate();

	</script>
</body>
</html>
