<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Track Editor</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }

		#toolbar {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 8px 10px;
			background: rgba(20, 20, 30, 0.85);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
			z-index: 10;
		}

		#toolbar button {
			padding: 8px 16px;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: rgba(255, 255, 255, 0.65);
			font-size: 13px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.15s;
			white-space: nowrap;
		}
		#toolbar button:hover {
			background: rgba(255, 255, 255, 0.1);
			color: #fff;
		}
		#toolbar button.active {
			background: rgba(255, 255, 255, 0.18);
			color: #fff;
		}

		.separator {
			width: 1px;
			height: 24px;
			background: rgba(255, 255, 255, 0.15);
			margin: 0 2px;
			flex-shrink: 0;
		}

		#toolbar button.action {
			background: rgba(80, 180, 80, 0.25);
			color: rgba(140, 255, 140, 0.9);
		}
		#toolbar button.action:hover {
			background: rgba(80, 180, 80, 0.4);
			color: #fff;
		}

		#toolbar button.danger {
			color: rgba(255, 255, 255, 0.45);
		}
		#toolbar button.danger:hover {
			background: rgba(220, 80, 80, 0.25);
			color: rgba(255, 140, 140, 0.9);
		}

		#toolbar button:disabled {
			opacity: 0.3;
			cursor: default;
			pointer-events: none;
		}

		#toast {
			position: absolute;
			bottom: 90px;
			left: 50%;
			transform: translateX(-50%);
			padding: 10px 24px;
			background: rgba(20, 20, 30, 0.85);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			color: #fff;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			font-size: 13px;
			opacity: 0;
			transition: opacity 0.3s;
			pointer-events: none;
			z-index: 20;
		}
		#toast.show { opacity: 1; }

		/* ─── Minimap ──────────────────────────────────────────── */

		#minimap {
			position: absolute;
			bottom: 80px;
			right: 16px;
			width: 180px;
			height: 180px;
			background: rgba(20, 20, 30, 0.75);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			overflow: hidden;
			z-index: 10;
		}
		#minimap canvas { width: 100%; height: 100%; }

		/* ─── Stats panel ──────────────────────────────────────── */

		#stats-panel {
			position: absolute;
			top: 16px;
			right: 16px;
			padding: 12px 16px;
			background: rgba(20, 20, 30, 0.75);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			color: rgba(255, 255, 255, 0.8);
			font-size: 12px;
			line-height: 1.7;
			z-index: 10;
			pointer-events: none;
		}
		#stats-panel .label { color: rgba(255, 255, 255, 0.45); }
		#stats-panel .warn { color: rgba(255, 180, 80, 0.9); }
		#stats-panel .ok { color: rgba(140, 255, 140, 0.9); }

		/* ─── Modal overlay ────────────────────────────────────── */

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.6);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
		}
		.modal-overlay.hidden { display: none; }

		.modal {
			background: rgba(30, 30, 45, 0.95);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
			color: #fff;
			padding: 24px;
			min-width: 320px;
			max-width: 440px;
			max-height: 80vh;
			overflow-y: auto;
		}
		.modal h3 {
			margin: 0 0 16px;
			font-size: 16px;
			font-weight: 600;
		}
		.modal input[type="text"] {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
			font-size: 14px;
			outline: none;
			margin-bottom: 12px;
		}
		.modal input[type="text"]:focus {
			border-color: rgba(140, 255, 140, 0.5);
		}
		.modal-actions {
			display: flex;
			gap: 8px;
			justify-content: flex-end;
			margin-top: 16px;
		}
		.modal-actions button {
			padding: 8px 20px;
			border: none;
			border-radius: 8px;
			font-size: 13px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.15s;
		}
		.modal-actions .btn-primary {
			background: rgba(80, 180, 80, 0.35);
			color: rgba(140, 255, 140, 0.95);
		}
		.modal-actions .btn-primary:hover {
			background: rgba(80, 180, 80, 0.55);
		}
		.modal-actions .btn-cancel {
			background: rgba(255, 255, 255, 0.08);
			color: rgba(255, 255, 255, 0.65);
		}
		.modal-actions .btn-cancel:hover {
			background: rgba(255, 255, 255, 0.15);
			color: #fff;
		}

		.saved-track-list {
			list-style: none;
			padding: 0;
			margin: 0 0 8px;
			max-height: 300px;
			overflow-y: auto;
		}
		.saved-track-list li {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 8px 12px;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.15s;
		}
		.saved-track-list li:hover {
			background: rgba(255, 255, 255, 0.08);
		}
		.saved-track-list li .track-name {
			font-size: 14px;
			font-weight: 500;
		}
		.saved-track-list li .track-meta {
			font-size: 11px;
			color: rgba(255, 255, 255, 0.4);
		}
		.saved-track-list li .delete-btn {
			background: none;
			border: none;
			color: rgba(255, 80, 80, 0.6);
			cursor: pointer;
			font-size: 16px;
			padding: 2px 6px;
			border-radius: 4px;
		}
		.saved-track-list li .delete-btn:hover {
			background: rgba(255, 80, 80, 0.15);
			color: rgba(255, 80, 80, 0.9);
		}
		.saved-track-list .empty-msg {
			text-align: center;
			color: rgba(255, 255, 255, 0.35);
			padding: 20px;
			font-size: 13px;
		}

	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>
	<div id="toolbar">
		<button id="btn-road" class="active">Road</button>
		<button id="btn-erase">Erase</button>
		<div class="separator"></div>
		<button id="btn-undo" disabled title="Undo (Ctrl+Z)">Undo</button>
		<button id="btn-redo" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
		<div class="separator"></div>
		<button id="btn-play" class="action">Play</button>
		<button id="btn-share" class="action">Share</button>
		<div class="separator"></div>
		<button id="btn-save">Save</button>
		<button id="btn-load">Load</button>
		<div class="separator"></div>
		<button id="btn-validate">Validate</button>
		<div class="separator"></div>
		<button id="btn-view-top" class="active" title="Top-down (0)">Top</button>
		<button id="btn-view-iso" title="Isometric">Iso</button>
		<button id="btn-view-front" title="Front view">Front</button>
		<div class="separator"></div>
		<button id="btn-tod" title="Time of day">Day</button>
		<div class="separator"></div>
		<button id="btn-clear" class="danger">Clear</button>
	</div>

	<div id="toast"></div>
	<div id="minimap"></div>

	<div id="stats-panel">
		<span class="label">Pieces:</span> <span id="stat-pieces">1</span><br>
		<span class="label">Straights:</span> <span id="stat-straights">0</span>
		<span class="label" style="margin-left:8px">Corners:</span> <span id="stat-corners">0</span><br>
		<span class="label">Length:</span> <span id="stat-length">0m</span><br>
		<span class="label">Loop:</span> <span id="stat-loop" class="warn">No</span>
	</div>

	<!-- Save modal -->
	<div id="modal-save" class="modal-overlay hidden">
		<div class="modal">
			<h3>Save Track</h3>
			<input type="text" id="save-name" placeholder="Track name..." maxlength="40" autocomplete="off">
			<div class="modal-actions">
				<button class="btn-cancel" id="save-cancel">Cancel</button>
				<button class="btn-primary" id="save-confirm">Save</button>
			</div>
		</div>
	</div>

	<!-- Load modal -->
	<div id="modal-load" class="modal-overlay hidden">
		<div class="modal">
			<h3>Load Track</h3>
			<ul class="saved-track-list" id="load-list"></ul>
			<div class="modal-actions">
				<button class="btn-cancel" id="load-cancel">Close</button>
			</div>
		</div>
	</div>

	<script type="module">
	import * as THREE from 'three';
	import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
	import { ORIENT_DEG, CELL_RAW, GRID_SCALE, encodeCells, decodeCells } from './js/Track.js';

	// ─── Auto-tile lookup ─────────────────────────────────────
	// Bitmask: N=8 S=4 E=2 W=1
	// Corner connectivity: 0°=S+W, 90°=S+E, 180°=N+E, 270°=N+W

	const ORIENT_FLIP = { 0: 10, 10: 0, 16: 22, 22: 16 };

	const AUTOTILE = [
		[ 'track-straight-night', 0 ],    //  0: isolated
		[ 'track-straight-night', 16 ],   //  1: W
		[ 'track-straight-night', 16 ],   //  2: E
		[ 'track-straight-night', 16 ],   //  3: E+W
		[ 'track-straight-night', 0 ],    //  4: S
		[ 'track-corner-night',   0 ],    //  5: S+W
		[ 'track-corner-night',   16 ],   //  6: S+E
		[ 'track-straight-night', 16 ],   //  7: S+E+W
		[ 'track-straight-night', 0 ],    //  8: N
		[ 'track-corner-night',   22 ],   //  9: N+W
		[ 'track-corner-night',   10 ],   // 10: N+E
		[ 'track-straight-night', 16 ],   // 11: N+E+W
		[ 'track-straight-night', 0 ],    // 12: N+S
		[ 'track-straight-night', 0 ],    // 13: N+S+W
		[ 'track-straight-night', 0 ],    // 14: N+S+E
		[ 'track-straight-night', 0 ],    // 15: N+S+E+W
	];

	// ─── State ────────────────────────────────────────────────

	const grid = new Map(); // "gx,gz" → { type, orient, isFinish, mesh }
	let tool = 'road'; // 'road', 'erase'

	function cellKey( gx, gz ) { return gx + ',' + gz; }

	// ─── Undo / Redo ─────────────────────────────────────────

	const undoStack = [];
	const redoStack = [];
	const MAX_UNDO = 100;

	function snapshotGrid() {

		const snap = [];
		for ( const [ key, cell ] of grid ) {

			const [ gx, gz ] = key.split( ',' ).map( Number );
			snap.push( [ gx, gz, cell.type, cell.orient, cell.isFinish ] );

		}

		return snap;

	}

	function restoreSnapshot( snap ) {

		// Remove all existing meshes
		for ( const [ , cell ] of grid ) {

			if ( cell.mesh ) trackGroup.remove( cell.mesh );

		}

		grid.clear();

		for ( const [ gx, gz, type, orient, isFinish ] of snap ) {

			const cell = { type, orient, isFinish, mesh: null };
			grid.set( cellKey( gx, gz ), cell );
			placeMesh( gx, gz, cell );

		}

		save();
		updateStats();
		updateFinishCar();

	}

	function pushUndo() {

		undoStack.push( snapshotGrid() );
		if ( undoStack.length > MAX_UNDO ) undoStack.shift();
		redoStack.length = 0;
		updateUndoButtons();

	}

	function undo() {

		if ( undoStack.length === 0 ) return;
		redoStack.push( snapshotGrid() );
		restoreSnapshot( undoStack.pop() );
		updateUndoButtons();

	}

	function redo() {

		if ( redoStack.length === 0 ) return;
		undoStack.push( snapshotGrid() );
		restoreSnapshot( redoStack.pop() );
		updateUndoButtons();

	}

	function updateUndoButtons() {

		document.getElementById( 'btn-undo' ).disabled = undoStack.length === 0;
		document.getElementById( 'btn-redo' ).disabled = redoStack.length === 0;

	}

	// ─── Renderer ─────────────────────────────────────────────

	const renderer = new THREE.WebGLRenderer( { antialias: true } );
	renderer.setSize( window.innerWidth, window.innerHeight );
	renderer.setPixelRatio( window.devicePixelRatio );
	renderer.shadowMap.enabled = true;
	renderer.toneMapping = THREE.ACESFilmicToneMapping;
	renderer.toneMappingExposure = 1.0;
	document.body.appendChild( renderer.domElement );

	// ─── Scene ────────────────────────────────────────────────

	const scene = new THREE.Scene();
	scene.background = new THREE.Color( 0xadb2ba );
	scene.fog = new THREE.Fog( 0xadb2ba, 80, 160 );

	const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
	dirLight.position.set( 11.4, 15, - 5.3 );
	dirLight.castShadow = true;
	dirLight.shadow.mapSize.setScalar( 4096 );
	dirLight.shadow.camera.near = 0.5;
	dirLight.shadow.camera.far = 100;
	dirLight.shadow.camera.left = - 60;
	dirLight.shadow.camera.right = 60;
	dirLight.shadow.camera.top = 60;
	dirLight.shadow.camera.bottom = - 60;
	scene.add( dirLight );

	const hemiLight = new THREE.HemisphereLight( 0xc8d8e8, 0x7a8a5a, 1.5 );
	scene.add( hemiLight );

	// Ground
	const groundMat = new THREE.MeshStandardMaterial( { color: 0x369069, metalness: 0 } );
	const ground = new THREE.Mesh( new THREE.PlaneGeometry( 200, 200 ), groundMat );
	ground.rotation.x = - Math.PI / 2;
	ground.position.y = - 0.14;
	ground.receiveShadow = true;
	scene.add( ground );

	// Grid helper
	const gridSize = 30;
	const cellWorld = CELL_RAW * GRID_SCALE;
	const gridHelper = new THREE.GridHelper( gridSize * cellWorld, gridSize, 0x4a7a2a, 0x4a7a2a );
	gridHelper.position.y = - 0.49;
	gridHelper.material.opacity = 0.3;
	gridHelper.material.transparent = true;
	scene.add( gridHelper );

	// Track group (mirrors game structure)
	const trackGroup = new THREE.Group();
	trackGroup.position.y = - 0.5;
	trackGroup.scale.setScalar( GRID_SCALE );
	scene.add( trackGroup );

	// Ghost preview group
	const ghostGroup = new THREE.Group();
	ghostGroup.position.y = - 0.5;
	ghostGroup.scale.setScalar( GRID_SCALE );
	scene.add( ghostGroup );
	let ghostMesh = null;

	// ─── Grid snap indicator ──────────────────────────────────

	const indicatorGeo = new THREE.PlaneGeometry( cellWorld, cellWorld );
	const indicatorMat = new THREE.MeshBasicMaterial( {
		color: 0xffffff,
		opacity: 0.15,
		transparent: true,
		depthTest: false
	} );
	const cellIndicator = new THREE.Mesh( indicatorGeo, indicatorMat );
	cellIndicator.rotation.x = - Math.PI / 2;
	cellIndicator.position.y = - 0.1;
	cellIndicator.visible = false;
	scene.add( cellIndicator );

	// Outline ring for the indicator
	const outlineGeo = new THREE.EdgesGeometry( new THREE.PlaneGeometry( cellWorld, cellWorld ) );
	const outlineMat = new THREE.LineBasicMaterial( { color: 0xffffff, opacity: 0.5, transparent: true, depthTest: false } );
	const cellOutline = new THREE.LineSegments( outlineGeo, outlineMat );
	cellOutline.rotation.x = - Math.PI / 2;
	cellOutline.position.y = - 0.09;
	cellOutline.visible = false;
	scene.add( cellOutline );

	// ─── Camera (orthographic) ────────────────────────────────

	const frustum = 30;
	const aspect = window.innerWidth / window.innerHeight;
	const camera = new THREE.OrthographicCamera(
		- frustum * aspect, frustum * aspect,
		frustum, - frustum,
		0.1, 200
	);
	const cellCenter = 0.5 * CELL_RAW * GRID_SCALE;
	const camTarget = new THREE.Vector3( cellCenter, 0, cellCenter );

	// ─── Orbit / tilt / height state ──────────────────────────

	let orbitAngle = 0;
	let tiltAngle = Math.PI / 2;
	let isOrbiting = false;
	let orbitStartMouse = { x: 0, y: 0 };
	let orbitAngleStart = 0;
	let tiltAngleStart = 0;
	let camHeightStart = 0;
	let camPanStart = { x: 0, z: 0 };

	function updateCamera() {

		const dist = 50;
		camera.position.x = camTarget.x + dist * Math.cos( tiltAngle ) * Math.sin( orbitAngle );
		camera.position.y = camTarget.y + dist * Math.sin( tiltAngle );
		camera.position.z = camTarget.z + dist * Math.cos( tiltAngle ) * Math.cos( orbitAngle );
		camera.lookAt( camTarget );

	}

	function getCameraPanAxes() {

		const right = new THREE.Vector3( Math.cos( orbitAngle ), 0, - Math.sin( orbitAngle ) );
		const fwd = new THREE.Vector3( - Math.sin( orbitAngle ), 0, - Math.cos( orbitAngle ) );
		return { right, fwd };

	}

	updateCamera();

	// ─── View presets ─────────────────────────────────────────

	const viewBtnTop = document.getElementById( 'btn-view-top' );
	const viewBtnIso = document.getElementById( 'btn-view-iso' );
	const viewBtnFront = document.getElementById( 'btn-view-front' );

	function setView( name ) {

		if ( name === 'top' ) {

			orbitAngle = 0;
			tiltAngle = Math.PI / 2;

		} else if ( name === 'iso' ) {

			orbitAngle = Math.PI / 4;
			tiltAngle = Math.PI / 5.1; // ~35°

		} else if ( name === 'front' ) {

			orbitAngle = 0;
			tiltAngle = 0.25; // ~14°

		}

		camTarget.y = 0;
		updateCamera();

		viewBtnTop.classList.toggle( 'active', name === 'top' );
		viewBtnIso.classList.toggle( 'active', name === 'iso' );
		viewBtnFront.classList.toggle( 'active', name === 'front' );

	}

	viewBtnTop.addEventListener( 'click', () => setView( 'top' ) );
	viewBtnIso.addEventListener( 'click', () => setView( 'iso' ) );
	viewBtnFront.addEventListener( 'click', () => setView( 'front' ) );

	// ─── Time of day ──────────────────────────────────────────

	const TOD_PRESETS = {
		day: {
			bg: 0xadb2ba,
			fog: 0xadb2ba,
			dirColor: 0xffffff,
			dirIntensity: 5,
			dirPos: [ 11.4, 15, - 5.3 ],
			hemiSky: 0xc8d8e8,
			hemiGround: 0x7a8a5a,
			hemiIntensity: 1.5,
			groundColor: 0x369069,
			exposure: 1.0,
			label: 'Day'
		},
		sunset: {
			bg: 0x8a6050,
			fog: 0x8a6050,
			dirColor: 0xffaa66,
			dirIntensity: 4,
			dirPos: [ 3, 5, - 12 ],
			hemiSky: 0xffccaa,
			hemiGround: 0x553322,
			hemiIntensity: 1.0,
			groundColor: 0x2d6648,
			exposure: 0.85,
			label: 'Sunset'
		},
		night: {
			bg: 0x1a1a2e,
			fog: 0x1a1a2e,
			dirColor: 0x8888cc,
			dirIntensity: 2,
			dirPos: [ - 5, 12, 8 ],
			hemiSky: 0x334466,
			hemiGround: 0x111122,
			hemiIntensity: 0.6,
			groundColor: 0x1a4a35,
			exposure: 0.6,
			label: 'Night'
		}
	};

	const todOrder = [ 'day', 'sunset', 'night' ];
	let todIndex = 0;
	const btnTod = document.getElementById( 'btn-tod' );

	function applyTod( name ) {

		const p = TOD_PRESETS[ name ];
		scene.background.setHex( p.bg );
		scene.fog.color.setHex( p.fog );
		dirLight.color.setHex( p.dirColor );
		dirLight.intensity = p.dirIntensity;
		dirLight.position.set( ...p.dirPos );
		hemiLight.color.setHex( p.hemiSky );
		hemiLight.groundColor.setHex( p.hemiGround );
		hemiLight.intensity = p.hemiIntensity;
		groundMat.color.setHex( p.groundColor );
		renderer.toneMappingExposure = p.exposure;
		btnTod.textContent = p.label;

	}

	btnTod.addEventListener( 'click', () => {

		todIndex = ( todIndex + 1 ) % todOrder.length;
		applyTod( todOrder[ todIndex ] );

	} );

	// ─── Minimap ──────────────────────────────────────────────

	const minimapSize = 180;
	const minimapCanvas = document.createElement( 'canvas' );
	minimapCanvas.width = minimapSize;
	minimapCanvas.height = minimapSize;
	document.getElementById( 'minimap' ).appendChild( minimapCanvas );
	const mmCtx = minimapCanvas.getContext( '2d' );

	function updateMinimap() {

		mmCtx.clearRect( 0, 0, minimapSize, minimapSize );
		mmCtx.fillStyle = 'rgba(20, 50, 35, 0.6)';
		mmCtx.fillRect( 0, 0, minimapSize, minimapSize );

		if ( grid.size === 0 ) return;

		// Find bounds
		let minGx = Infinity, maxGx = - Infinity;
		let minGz = Infinity, maxGz = - Infinity;

	// ─── Finish line car preview ──────────────────────────────

	// ─── Auto-tile resolve ────────────────────────────────────

	// Exit bitmask for each piece type/orient
	// Bits: N=8 S=4 E=2 W=1
	function getCellExits( cell ) {

		const t = cell.type;
		const o = cell.orient;

		if ( t === 'track-corner-night' ) {

			if ( o === 0 ) return 5;    // S+W
			if ( o === 16 ) return 6;   // S+E
			if ( o === 10 ) return 10;  // N+E
			if ( o === 22 ) return 9;   // N+W

		}

		// Straight, finish, bump — all symmetric
		if ( o === 0 || o === 10 ) return 12; // N+S

	}

	// Check which neighbors have a road exit facing toward this cell
	function getConnectivityMask( gx, gz ) {

		let mask = 0;

		// N neighbor has S exit?
		const n = grid.get( cellKey( gx, gz - 1 ) );
		if ( n && ( getCellExits( n ) & 4 ) ) mask |= 8;

		// S neighbor has N exit?
		const s = grid.get( cellKey( gx, gz + 1 ) );
		if ( s && ( getCellExits( s ) & 8 ) ) mask |= 4;

		// E neighbor has W exit?
		const e = grid.get( cellKey( gx + 1, gz ) );
		if ( e && ( getCellExits( e ) & 1 ) ) mask |= 2;

		// W neighbor has E exit?

		return mask;

	}

	// Raw presence mask (any road in adjacent cell)
	function getPresenceMask( gx, gz ) {

		let mask = 0;

		if ( grid.has( cellKey( gx, gz + 1 ) ) ) mask |= 4;

	// Count bits in a 4-bit mask
	function bitCount( mask ) {

	// Count how many of a cell's exits are connected to neighbors
	function connectedExitCount( gx, gz ) {

		const cell = grid.get( cellKey( gx, gz ) );

		return bitCount( getCellExits( cell ) & getConnectivityMask( gx, gz ) );

	// When a new cell has 3+ neighbors, pick the best pair to connect.
	// Prefer corners over straights, then prefer neighbors with more existing connections.
	const DIR_INFO = [
		{ bit: 8, dx: 0, dz: - 1 }, // N
		{ bit: 4, dx: 0, dz: 1 },   // S
		{ bit: 2, dx: 1, dz: 0 },   // E
		{ bit: 1, dx: - 1, dz: 0 }, // W
	];

	function pickBestPair( mask, gx, gz ) {

		const active = DIR_INFO.filter( d => mask & d.bit );
		if ( active.length <= 2 ) return mask;

		let bestMask = active[ 0 ].bit | active[ 1 ].bit;
		let bestScore = - 1;
		let bestIsCorner = false;

		for ( let i = 0; i < active.length; i ++ ) {

			for ( let j = i + 1; j < active.length; j ++ ) {

				const pairMask = active[ i ].bit | active[ j ].bit;
				const isCorner = ( pairMask !== 3 && pairMask !== 12 ); // not E+W or N+S

				const s1 = connectedExitCount( gx + active[ i ].dx, gz + active[ i ].dz );
				const s2 = connectedExitCount( gx + active[ j ].dx, gz + active[ j ].dz );
				const score = s1 + s2;

				if ( ( isCorner && ! bestIsCorner ) ||

	function getAvailableMask( gx, gz ) {

		const dirs = [
			[ 0, - 1, 8, 4 ], // N neighbor, sets N bit, check if neighbor has S exit
			[ 0, 1, 4, 8 ],   // S neighbor, sets S bit, check if neighbor has N exit
			[ 1, 0, 2, 1 ],   // E neighbor, sets E bit, check if neighbor has W exit
			[ - 1, 0, 1, 2 ], // W neighbor, sets W bit, check if neighbor has E exit
		];

		for ( const [ dx, dz, bit, oppBit ] of dirs ) {

			const neighbor = grid.get( cellKey( gx + dx, gz + dz ) );
			if ( ! neighbor ) continue;

			const exits = getCellExits( neighbor );

			// Already has an exit facing us
			if ( exits & oppBit ) { mask |= bit; continue; }

			// Has a free (unconnected) exit — could change to face us

	// Resolve tile for new cells: use available neighbors, pick best pair if 3+
	function resolveNewTile( gx, gz ) {

	function resolveTile( gx, gz ) {

	// ─── Ghost preview ────────────────────────────────────────

	// Neighbor cells whose meshes are temporarily swapped during ghost preview

		const src = models[ type ];

				grid.set( cellKey( gx, gz ), cell );

		if ( e.key === 'Escape' ) modalSave.classList.add( 'hidden' );
		e.stopPropagation();

	} );

	document.getElementById( 'save-cancel' ).addEventListener( 'click', () => {

		modalSave.classList.add( 'hidden' );

	} );

	// Load modal
	const modalLoad = document.getElementById( 'modal-load' );
	const loadList = document.getElementById( 'load-list' );

	document.getElementById( 'btn-load' ).addEventListener( 'click', () => {

		const tracks = getSavedTracks();
		loadList.innerHTML = '';

		if ( tracks.length === 0 ) {

			loadList.innerHTML = '<li class="empty-msg">No saved tracks yet</li>';

		} else {

			for ( const t of tracks ) {

				const li = document.createElement( 'li' );

				const info = document.createElement( 'div' );
				info.innerHTML = `<div class="track-name">${ t.name }</div><div class="track-meta">${ t.pieces } pieces &middot; ${ t.date }</div>`;
				info.style.cursor = 'pointer';
				info.style.flex = '1';
				info.addEventListener( 'click', () => {

					loadNamedTrack( t.cells );
					modalLoad.classList.add( 'hidden' );
					showToast( `Loaded "${ t.name }"` );

				} );

				const del = document.createElement( 'button' );
				del.className = 'delete-btn';
				del.textContent = '\u00d7';
				del.title = 'Delete';
				del.addEventListener( 'click', ( ev ) => {

					ev.stopPropagation();
					deleteNamedTrack( t.name );
					li.remove();
					if ( loadList.children.length === 0 ) {

						loadList.innerHTML = '<li class="empty-msg">No saved tracks yet</li>';

					}

					showToast( `Deleted "${ t.name }"` );

				} );

				li.appendChild( info );
				li.appendChild( del );
				loadList.appendChild( li );

			}

		}

		modalLoad.classList.remove( 'hidden' );

	} );

	document.getElementById( 'load-cancel' ).addEventListener( 'click', () => {

		modalLoad.classList.add( 'hidden' );

	} );

	// Close modals on overlay click
	modalSave.addEventListener( 'click', ( e ) => {

		if ( e.target === modalSave ) modalSave.classList.add( 'hidden' );

	} );

	modalLoad.addEventListener( 'click', ( e ) => {

		if ( e.target === modalLoad ) modalLoad.classList.add( 'hidden' );

	} );

	// ─── Track validation ─────────────────────────────────────

	function validateTrack() {

		// Find finish cell
		let startKey = null;

		for ( const [ key, cell ] of grid ) {

			if ( cell.isFinish ) { startKey = key; break; }

		}

		if ( ! startKey ) return { valid: false, message: 'No finish line found' };
		if ( grid.size < 4 ) return { valid: false, message: 'Track too short (need at least 4 pieces)' };

		// Walk the track from finish, following exits
		const [ sx, sz ] = startKey.split( ',' ).map( Number );
		const startCell = grid.get( startKey );
		const startExits = getCellExits( startCell );

		// Pick one exit direction to start walking
		const exitDirs = [
			{ bit: 8, dx: 0, dz: - 1 },
			{ bit: 4, dx: 0, dz: 1 },
			{ bit: 2, dx: 1, dz: 0 },
			{ bit: 1, dx: - 1, dz: 0 },
		];

		let walkDir = null;

		for ( const d of exitDirs ) {

			if ( ! ( startExits & d.bit ) ) continue;
			const nKey = cellKey( sx + d.dx, sz + d.dz );
			if ( grid.has( nKey ) ) { walkDir = d; break; }

		}

		if ( ! walkDir ) return { valid: false, message: 'Finish line has no connected road' };

		// Walk
		const visited = new Set();
		visited.add( startKey );
		let cx = sx + walkDir.dx;
		let cz = sz + walkDir.dz;
		let prevX = sx;
		let prevZ = sz;

		for ( let steps = 0; steps < 1000; steps ++ ) {

			const key = cellKey( cx, cz );

			// Did we loop back to start?
			if ( key === startKey ) {

				if ( visited.size === grid.size ) {

					return { valid: true, message: `Valid loop! (${ visited.size } pieces)` };

				}

				return {
					valid: false,
					message: `Loop found but ${ grid.size - visited.size } pieces are disconnected`
				};

			}

			const cell = grid.get( key );
			if ( ! cell ) return { valid: false, message: 'Track has a dead end' };

			if ( visited.has( key ) ) return { valid: false, message: 'Track crosses itself' };

			visited.add( key );

			// Find next cell: follow exits that aren't back where we came from
			const exits = getCellExits( cell );
			let moved = false;

			for ( const d of exitDirs ) {

				if ( ! ( exits & d.bit ) ) continue;
				const nx = cx + d.dx;
				const nz = cz + d.dz;
				if ( nx === prevX && nz === prevZ ) continue;

				prevX = cx;
				prevZ = cz;
				cx = nx;
				cz = nz;
				moved = true;
				break;

			}

			if ( ! moved ) return { valid: false, message: 'Track has a dead end' };

		}

		return { valid: false, message: 'Track is too long or has an issue' };

	}

	document.getElementById( 'btn-validate' ).addEventListener( 'click', () => {

		const result = validateTrack();

		if ( result.valid ) {

			showToast( '\u2705 ' + result.message );

		} else {

			showToast( '\u274c ' + result.message );

		}

	} );

	// ─── Track stats ──────────────────────────────────────────

	function updateStats() {

		let pieces = 0, straights = 0, corners = 0;

		for ( const [ , cell ] of grid ) {

			pieces ++;
			if ( cell.type === 'track-corner-night' ) corners ++;
			else straights ++;

		}

		const length = ( pieces * cellWorld ).toFixed( 0 );

		document.getElementById( 'stat-pieces' ).textContent = pieces;
		document.getElementById( 'stat-straights' ).textContent = straights;
		document.getElementById( 'stat-corners' ).textContent = corners;
		document.getElementById( 'stat-length' ).textContent = length + 'm';

		// Quick loop check
		const result = validateTrack();
		const loopEl = document.getElementById( 'stat-loop' );
		loopEl.textContent = result.valid ? 'Yes' : 'No';
		loopEl.className = result.valid ? 'ok' : 'warn';

	}

	// ─── Toast ────────────────────────────────────────────────

	let toastTimer = 0;

	function showToast( msg ) {

		const el = document.getElementById( 'toast' );
		el.textContent = msg;
		el.classList.add( 'show' );
		clearTimeout( toastTimer );
		toastTimer = setTimeout( () => el.classList.remove( 'show' ), 2000 );

	}

	// ─── Toolbar ──────────────────────────────────────────────

	const btnRoad = document.getElementById( 'btn-road' );
	const btnErase = document.getElementById( 'btn-erase' );

	function selectTool( t ) {

		tool = t;
		btnRoad.classList.toggle( 'active', t === 'road' );
		btnErase.classList.toggle( 'active', t === 'erase' );

	}

	btnRoad.addEventListener( 'click', () => selectTool( 'road' ) );
	btnErase.addEventListener( 'click', () => selectTool( 'erase' ) );

	document.getElementById( 'btn-undo' ).addEventListener( 'click', undo );
	document.getElementById( 'btn-redo' ).addEventListener( 'click', redo );

	function getCellsArray() {

		const arr = [];
		for ( const [ key, cell ] of grid ) {

			const [ gx, gz ] = key.split( ',' ).map( Number );
			arr.push( [ gx, gz, cell.type, cell.orient ] );

		}

		return arr;

	}

	document.getElementById( 'btn-play' ).addEventListener( 'click', () => {

		if ( grid.size === 0 ) {

			showToast( 'Draw some road first!' );
			return;

		}

		const encoded = encodeCells( getCellsArray() );
		window.open( 'index.html?map=' + encoded, '_blank' );

	} );

	document.getElementById( 'btn-share' ).addEventListener( 'click', () => {

		if ( grid.size === 0 ) {

			showToast( 'Draw some road first!' );
			return;

		}

		const encoded = encodeCells( getCellsArray() );
		const base = window.location.href.replace( /editor\.html.*/, '' );
		const url = base + 'index.html?map=' + encoded;

		navigator.clipboard.writeText( url ).then( () => {

			showToast( 'Link copied to clipboard!' );

		} ).catch( () => {

			showToast( url );

		} );

	} );

	document.getElementById( 'btn-clear' ).addEventListener( 'click', () => {

		clearAll();
		showToast( 'Track cleared' );

	} );

	// ─── Input (pointer events) ───────────────────────────────

	let isPanning = false;
	let isDrawing = false;
	let isErasing = false;
	let panStart = { x: 0, y: 0 };
	let camStart = { x: 0, z: 0 };
	let lastDrawCell = null;
	let spaceDown = false;

	// Track active pointers for multi-touch (pinch/pan)
	const pointers = new Map();
	let pinchStartDist = 0;
	let pinchStartZoom = 1;

	const el = renderer.domElement;

	el.addEventListener( 'contextmenu', ( e ) => e.preventDefault() );

	function handleDraw( clientX, clientY ) {

		const cell = screenToGrid( clientX, clientY );
		if ( ! cell ) return;

		if ( lastDrawCell && lastDrawCell.gx === cell.gx && lastDrawCell.gz === cell.gz ) return;
		lastDrawCell = cell;

		if ( isErasing ) {

			eraseRoad( cell.gx, cell.gz );

		} else if ( isDrawing ) {

			placeRoad( cell.gx, cell.gz );

		}

	}

	function getPinchDist() {

		const pts = [ ...pointers.values() ];
		const dx = pts[ 1 ].x - pts[ 0 ].x;
		const dy = pts[ 1 ].y - pts[ 0 ].y;
		return Math.sqrt( dx * dx + dy * dy );

	}

	function getPinchMid() {

		const pts = [ ...pointers.values() ];
		return {
			x: ( pts[ 0 ].x + pts[ 1 ].x ) / 2,
			y: ( pts[ 0 ].y + pts[ 1 ].y ) / 2
		};

	}

	el.addEventListener( 'pointerdown', ( e ) => {

		el.setPointerCapture( e.pointerId );
		pointers.set( e.pointerId, { x: e.clientX, y: e.clientY } );

		// Two pointers → switch to pan/pinch
		if ( pointers.size === 2 ) {

			isDrawing = false;
			isErasing = false;
			isPanning = true;

			const mid = getPinchMid();
			panStart.x = mid.x;
			panStart.y = mid.y;
			camStart.x = camTarget.x;
			camStart.z = camTarget.z;
			pinchStartDist = getPinchDist();
			pinchStartZoom = camera.zoom;
			return;

		}

		if ( pointers.size > 2 ) return;

		// Single pointer
		// Middle mouse, ctrl+click, or space+click → pan
		if ( e.button === 1 || ( e.button === 0 && ( e.ctrlKey || e.metaKey || spaceDown ) ) ) {

			isPanning = true;
			panStart.x = e.clientX;
			panStart.y = e.clientY;
			camStart.x = camTarget.x;
			camStart.z = camTarget.z;
			el.style.cursor = 'grabbing';
			return;

		}

		if ( e.button === 0 ) {

			if ( tool === 'erase' ) {

				isErasing = true;

			} else {

				isDrawing = true;

			}

			lastDrawCell = null;

			// On touch, defer draw until pointermove confirms single-finger gesture
			if ( e.pointerType !== 'touch' ) handleDraw( e.clientX, e.clientY );

		} else if ( e.button === 2 ) {

			isOrbiting = true;
			orbitStartMouse = { x: e.clientX, y: e.clientY };
			orbitAngleStart = orbitAngle;
			tiltAngleStart = tiltAngle;
			camHeightStart = camTarget.y;
			camPanStart = { x: camTarget.x, z: camTarget.z };

		}

	} );

	el.addEventListener( 'pointermove', ( e ) => {

		pointers.set( e.pointerId, { x: e.clientX, y: e.clientY } );

		// Two-pointer pan + pinch
		if ( pointers.size === 2 && isPanning ) {

			const mid = getPinchMid();
			const scale = frustum * 2 / window.innerHeight / camera.zoom;
			const sdx = ( mid.x - panStart.x ) * scale;
			const sdy = ( mid.y - panStart.y ) * scale;
			const { right, fwd } = getCameraPanAxes();
			camTarget.x = camStart.x - right.x * sdx - fwd.x * sdy;
			camTarget.z = camStart.z - right.z * sdx - fwd.z * sdy;
			updateCamera();

			const dist = getPinchDist();
			camera.zoom = Math.max( 0.1, Math.min( 10, pinchStartZoom * ( dist / pinchStartDist ) ) );
			camera.updateProjectionMatrix();
			return;

		}

		// Orbit / tilt / height (right-click drag)
		if ( isOrbiting ) {

			const dx = e.clientX - orbitStartMouse.x;
			const dy = e.clientY - orbitStartMouse.y;

			if ( e.shiftKey ) {

				// Shift+RMB: height (up/down) and pan (left/right)
				camTarget.y = Math.max( - 20, Math.min( 20, camHeightStart - dy * 0.1 ) );
				const scale = frustum * 2 / window.innerHeight / camera.zoom;
				const { right } = getCameraPanAxes();
				camTarget.x = camPanStart.x + right.x * dx * scale;
				camTarget.z = camPanStart.z + right.z * dx * scale;

			} else {

				// RMB: orbit (left/right) and tilt (up/down)
				orbitAngle = orbitAngleStart + dx * 0.005;
				tiltAngle = Math.max( 0.17, Math.min( Math.PI / 2, tiltAngleStart - dy * 0.005 ) );

			}

			updateCamera();

			// Clear view preset active states when user manually orbits
			viewBtnTop.classList.remove( 'active' );
			viewBtnIso.classList.remove( 'active' );
			viewBtnFront.classList.remove( 'active' );
			return;

		}

		// Single-pointer pan
		if ( isPanning ) {

			const scale = frustum * 2 / window.innerHeight / camera.zoom;
			const sdx = ( e.clientX - panStart.x ) * scale * ( window.innerWidth / window.innerHeight );
			const sdy = ( e.clientY - panStart.y ) * scale;
			const { right, fwd } = getCameraPanAxes();
			camTarget.x = camStart.x - right.x * sdx - fwd.x * sdy;
			camTarget.z = camStart.z - right.z * sdx - fwd.z * sdy;
			updateCamera();
			return;

		}

		if ( isDrawing || isErasing ) {

			handleDraw( e.clientX, e.clientY );
			return;

		}

		// Hover ghost + cell indicator (mouse only)
		if ( e.pointerType === 'mouse' ) {

			const cell = screenToGrid( e.clientX, e.clientY );
			if ( cell ) {

				hoveredCell = cell;
				updateGhost( cell.gx, cell.gz );
				updateCellIndicator( cell.gx, cell.gz );

			} else {

				hoveredCell = null;
				clearGhost();
				hideCellIndicator();

			}

		}

	} );

	window.addEventListener( 'pointerup', ( e ) => {

		pointers.delete( e.pointerId );

		if ( pointers.size === 0 ) {

			// Touch tap: if we deferred draw and never moved, draw now
			if ( ( isDrawing || isErasing ) && lastDrawCell === null && ! isPanning ) {

				handleDraw( e.clientX, e.clientY );

			}

			isPanning = false;
			isOrbiting = false;
			isDrawing = false;
			isErasing = false;
			lastDrawCell = null;
			el.style.cursor = spaceDown ? 'grab' : '';

		}

	} );

	window.addEventListener( 'pointercancel', ( e ) => {

		pointers.delete( e.pointerId );

	} );

	function zoomCamera( delta ) {

		const zoomSpeed = 1.08;
		camera.zoom *= delta > 0 ? 1 / zoomSpeed : zoomSpeed;
		camera.zoom = Math.max( 0.1, Math.min( 10, camera.zoom ) );
		camera.updateProjectionMatrix();

	}

	el.addEventListener( 'wheel', ( e ) => {

		e.preventDefault();
		zoomCamera( e.deltaY );

	}, { passive: false } );

	window.addEventListener( 'keydown', ( e ) => {

		// Don't capture keys when typing in an input
		if ( e.target.tagName === 'INPUT' ) return;

		if ( e.key === ' ' ) {

			if ( ! spaceDown ) {

				spaceDown = true;
				el.style.cursor = 'grab';

			}

			e.preventDefault();

		} else if ( e.key === '1' ) {

			selectTool( 'road' );

		} else if ( e.key === '2' ) {

			selectTool( 'erase' );

		} else if ( e.key === '0' ) {

			setView( 'top' );

		} else if ( e.key === 'z' && ( e.ctrlKey || e.metaKey ) && e.shiftKey ) {

			e.preventDefault();
			redo();

		} else if ( e.key === 'z' && ( e.ctrlKey || e.metaKey ) ) {

			e.preventDefault();
			undo();

		} else if ( e.key === '+' || e.key === '=' ) {

			zoomCamera( - 1 );

		} else if ( e.key === '-' || e.key === '_' ) {

			zoomCamera( 1 );

		}

	} );

	window.addEventListener( 'keyup', ( e ) => {

		if ( e.key === ' ' ) {

			spaceDown = false;
			if ( ! isPanning ) el.style.cursor = '';

		}

	} );

	// ─── Init & render loop ───────────────────────────────────

	await loadModels();
	loadSaved();

	// Start with a finish cell if the grid is empty
	if ( grid.size === 0 ) {

		placeFinish();

	}

	updateStats();
	updateFinishCar();

	function animate() {

		requestAnimationFrame( animate );
		renderer.render( scene, camera );
		updateMinimap();

	}

	animate();

	</script>
</body>
</html>
