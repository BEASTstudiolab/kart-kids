<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Kart Kids — Menu System</title>
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<style>
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			padding: 0;
			background: var(--color-near-black, #0a0a0a);
			color: var(--color-white, #fff);
			font-family: var(--font-ui, sans-serif);
			height: 100%;
			overflow: hidden;
		}
		#app-mount {
			width: 100%;
			height: 100%;
		}
		/* AppShell layout */
		.kk-app-shell {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			position: relative;
		}
		.kk-page-container {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			position: relative;
		}
		/* Toast region */
		.kk-toast-region {
			position: fixed;
			bottom: calc(var(--actionbar-height, 80px) + var(--space-4, 16px));
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			flex-direction: column-reverse;
			gap: var(--space-2, 8px);
			z-index: var(--z-toast, 600);
			pointer-events: none;
		}
		.kk-toast-region > * { pointer-events: auto; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
</head>
<body>

<div id="app-mount"></div>

<script type="module">
import { AppShell } from './js/ui/core/AppShell.js';

const mount = document.getElementById('app-mount');
const app = new AppShell(mount);
app.bootstrap();

console.log('%c KART KIDS Menu System Loaded ', 'background: #ff6b00; color: #000; font-weight: bold; padding: 4px 12px; border-radius: 4px;');
console.log('Navigate by changing the URL hash:');
console.log('  #/         → Title Screen');
console.log('  #/home     → Home / Main Menu');
console.log('  #/quick-play → Quick Play');
console.log('  #/play     → Play Modes');
console.log('  #/lobby    → Lobby');
console.log('  #/results  → Results');
console.log('  #/pause    → Pause Menu');
console.log('  #/garage   → Garage (placeholder)');
console.log('  #/settings → Settings (placeholder)');
</script>

</body>
</html>
