<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Kart Kids</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff6b00'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='%23000'%3EKK%3C/text%3E%3C/svg%3E">
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<style>
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			padding: 0;
			background: #000;
			color: #fff;
			font-family: var(--font-ui, sans-serif);
			height: 100%;
			overflow: hidden;
		}
		/* ── 3D Canvas layer (z-index 0) ────────────────────────── */
		#canvas-container {
			position: fixed;
			inset: 0;
			z-index: 0;
		}
		#canvas-container canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		/* ── Menu UI layer (z-index 1+) ─────────────────────────── */
		#app-mount {
			position: relative;
			z-index: 1;
			width: 100%;
			height: 100%;
		}
		.kk-app-shell {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			position: relative;
		}
		.kk-page-container {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			position: relative;
		}
		/* Toast region */
		.kk-toast-region {
			position: fixed;
			bottom: calc(var(--actionbar-height, 80px) + var(--space-4, 16px));
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			flex-direction: column-reverse;
			gap: var(--space-2, 8px);
			z-index: var(--z-toast, 600);
			pointer-events: none;
		}
		.kk-toast-region > * { pointer-events: auto; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/",
			"three/webgpu": "./node_modules/three/build/three.webgpu.js",
			"crashcat": "./node_modules/crashcat/dist/index.js",
			"mathcat": "./node_modules/mathcat/dist/index.js"
		}
	}
	</script>
</head>
<body>

<div id="canvas-container"></div>
<div id="app-mount"></div>

<script type="module">
import { AppShell } from './js/ui/core/AppShell.js';
import { LoadingOverlay } from './js/ui/components/LoadingOverlay.js';

const mount = document.getElementById( 'app-mount' );
const canvasContainer = document.getElementById( 'canvas-container' );
const bootstrapOverlay = new LoadingOverlay( {
	message: 'Launching menu',
	detail: 'Building interface shell',
	phase: 'Booting',
} );
bootstrapOverlay.show();

const app = new AppShell( mount, { canvasContainer } );
try {

	await app.bootstrap( {
		onProgress: ( nextState ) => bootstrapOverlay.setState( nextState ),
	} );
	bootstrapOverlay.setState( {
		phase: 'Ready',
		message: 'Menu Ready',
		detail: 'Startup complete',
		progress: 1,
		determinate: true,
	} );
	bootstrapOverlay.hide();

} catch ( err ) {

	console.error( '[index] App bootstrap failed:', err );
	bootstrapOverlay.showError( 'Kart Kids failed to start' );
	throw err;

}

console.log( '%c KART KIDS Menu System Loaded ', 'background: #ff6b00; color: #000; font-weight: bold; padding: 4px 12px; border-radius: 4px;' );
</script>

</body>
</html>
