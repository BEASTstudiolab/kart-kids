<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Kart Kids</title>
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<style>
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			padding: 0;
			background: #000;
			color: #fff;
			font-family: var(--font-ui, sans-serif);
			height: 100%;
			overflow: hidden;
		}
		/* ── 3D Canvas layer (z-index 0) ────────────────────────── */
		#canvas-container {
			position: fixed;
			inset: 0;
			z-index: 0;
		}
		#canvas-container canvas {
			display: block;
			width: 100%;
			height: 100%;
			touch-action: none;
		}
		/* ── Menu UI layer (z-index 1+) ─────────────────────────── */
		#app-mount {
			position: relative;
			z-index: 1;
			width: 100%;
			height: 100%;
		}
		.kk-app-shell {
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			position: relative;
		}
		.kk-page-container {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			position: relative;
		}
		/* Toast region */
		.kk-toast-region {
			position: fixed;
			bottom: calc(var(--actionbar-height, 80px) + var(--space-4, 16px));
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			flex-direction: column-reverse;
			gap: var(--space-2, 8px);
			z-index: var(--z-toast, 600);
			pointer-events: none;
		}
		.kk-toast-region > * { pointer-events: auto; }
		/* ── Loading overlay ─────────────────────────────────────── */
		#loading-overlay {
			position: fixed; inset: 0; z-index: 9999;
			background: #1a1a2e;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			font-family: sans-serif; color: #fff;
			transition: opacity 0.4s;
		}
		#loading-overlay.fade-out { opacity: 0; pointer-events: none; }
		#loading-title { font-size: 28px; font-weight: bold; margin-bottom: 24px; letter-spacing: 2px; }
		#loading-bar-bg {
			width: min(320px, 70vw); height: 8px;
			background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden;
		}
		#loading-bar {
			height: 100%; width: 0%; border-radius: 4px;
			background: linear-gradient(90deg, #4fc3f7, #29b6f6);
			transition: width 0.15s;
		}
		#loading-text { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.5); }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/",
			"three/webgpu": "./node_modules/three/build/three.webgpu.js",
			"crashcat": "./node_modules/crashcat/dist/index.js"
		}
	}
	</script>
</head>
<body>

<div id="loading-overlay">
	<div id="loading-title">KART KIDS</div>
	<div id="loading-bar-bg"><div id="loading-bar"></div></div>
	<div id="loading-text">Loading...</div>
</div>

<div id="canvas-container"></div>
<div id="app-mount"></div>

<script type="module">
import { AppShell } from './js/ui/core/AppShell.js';
import { createGameEngine } from './js/GameEngine.js';

const mount = document.getElementById( 'app-mount' );
const app = new AppShell( mount );
app.bootstrap();

// ── Launch GameEngine (standalone mode until Unit 4 integrates AppShell) ──
const engine = createGameEngine( document.body );

engine.start( { mode: 'solo' } ).then( () => {

	// Hide menu UI while game is running (Unit 4 will handle this properly)
	mount.style.display = 'none';

	function animate() {

		if ( ! engine.isRunning() ) return;
		requestAnimationFrame( animate );
		engine.update();

	}

	requestAnimationFrame( animate );

} ).catch( ( e ) => console.error( 'GameEngine init failed:', e ) );

console.log( '%c KART KIDS Menu System Loaded ', 'background: #ff6b00; color: #000; font-weight: bold; padding: 4px 12px; border-radius: 4px;' );
</script>

</body>
</html>
