<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Kart Kids</title>
	<link rel="stylesheet" href="js/ui/ui-theme.css">
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		#editor-link {
			position: absolute;
			bottom: 12px;
			left: 16px;
			color: #fff;
			font: 14px sans-serif;
			text-decoration: none;
			background: rgba(0,0,0,0.5);
			padding: 8px 14px;
			border-radius: 6px;
			z-index: 10;
		}
		#editor-link:hover { background: rgba(0,0,0,0.7); }
		#spectate-btn {
			position: absolute;
			bottom: 52px;
			right: 16px;
			color: #fff;
			font: 14px sans-serif;
			background: rgba(0,0,0,0.5);
			padding: 8px 14px;
			border-radius: 6px;
			border: 1px solid rgba(255,255,255,0.3);
			cursor: pointer;
			z-index: 10;
			display: none;
		}
		#spectate-btn:hover { background: rgba(0,0,0,0.7); }
		@media (pointer: coarse) {
			#editor-link { bottom: 12px; left: 16px; }
			#spectate-btn { bottom: 12px; }
		}
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "./node_modules/three/build/three.module.js",
			"three/addons/": "./node_modules/three/examples/jsm/",
			"three/webgpu": "./node_modules/three/build/three.webgpu.js",
			"crashcat": "https://esm.sh/crashcat@0.0.2"
		}
	}
	</script>
</head>
<body>
	<button id="spectate-btn">Spectate</button>
	<a id="editor-link" href="editor.html">Create your own track</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
